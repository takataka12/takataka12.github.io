name: Update Pulse JP digest

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC.
    # 22:00 UTC = 07:00 JST
    # 11:00 UTC = 20:00 JST
    - cron: "0 22 * * *"
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pulsejp/backend/requirements.txt

      - name: Generate digest
        run: python pulsejp/backend/generate_digest.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulsejp/digest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Pulse JP digest"
          git push
