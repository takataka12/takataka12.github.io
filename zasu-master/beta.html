<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>β参加｜ZASU MASTER</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html"><span class="main">ZASU MASTER</span><span class="jp">ザスマス</span></a></div></header>
<main><section class="hero" style="padding-bottom:40px;border-top:0"><div class="wrap"><div class="kicker">Closed Beta</div><h1 style="font-size:clamp(46px,8vw,82px)">BETA TEST.</h1><p>ZASU MASTERの初期テストユーザーを募集するための仮フォームです。</p></div></section>
<section><div class="wrap"><div class="card"><h2 style="font-size:36px">参加フォーム</h2><form id="betaForm">
<div class="form-row"><div><label>名前 / ハンドルネーム</label><input name="name" required></div><div><label>メール</label><input name="email" type="email" required></div></div>
<div class="form-row"><div><label>主なジャンル</label><select name="genre"><option>Rock / Metal / Hardcore</option><option>Pop</option><option>Hip-Hop</option><option>EDM</option><option>Acoustic</option><option>Other</option></select></div><div><label>主なDAW</label><input name="daw" placeholder="Logic Pro / Ableton Live など"></div></div>
<div><label>普段のマスタリング方法</label><select name="mastering"><option>自分で行う</option><option>AI / 自動マスタリング</option><option>エンジニアへ依頼</option><option>特に決めていない</option></select></div>
<div><label>コメント / テストしたい曲について</label><textarea name="message"></textarea></div>
<button class="btn" type="submit">β参加希望を送る</button><div id="formStatus" class="mini"></div>
</form></div><div class="note">現在はβ受付準備中です。送信先を接続すると、このページから応募を受け付けられます。</div></div></section></main>
<footer><div class="wrap"><a href="index.html">← ZASU MASTERへ戻る</a></div></footer><script src="assets/config.js"></script><script src="assets/main.js"></script></body></html>
